<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href=
    "https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src=
    "https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
    <title>Adventure Park Challenge</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">Peak Adventures</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#challenges">Challenges</a></li>
        <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
        <li class="nav-item"><a class="btn btn-warning ms-lg-3" href="#booking">Book Now</a></li>
      </ul>
    </div>
  </div>
</nav>

<section id="challenges" class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-5">Our Challenge Courses</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col">
        <div class="card h-100">
          <img src="path/to/beginner-course.jpg" class="card-img-top" alt="Beginner Ropes Course">
          <div class="card-body">
            <h5 class="card-title">The Canopy Walk</h5>
            <p class="card-text">Perfect for beginners and families. Suspended bridges and easy zip lines 10 feet off the ground.</p>
            <span class="badge bg-success">Easy</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal">
  Reserve Your Spot
</button>

<div class="modal fade" id="bookingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Book Your Adventure</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
      </div>
    </div>
  </div>
</div>

  </body>
</html>
